name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate and package
        run: npm run check
      - name: Prepare release notes
        run: npm run release:prepare -- "$GITHUB_REF_NAME"
      - name: Upload isolated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download isolated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Verify checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" \
            "release-assets/tabbridge-chrome-v${VERSION}.zip" \
            "release-assets/tabbridge-firefox-v${VERSION}.zip" \
            release-assets/*.sha256 \
            release-assets/SHA256SUMS \
            --repo "$REPOSITORY" \
            --verify-tag \
            --title "TabBridge $TAG" \
            --notes-file release-assets/RELEASE_NOTES.md
